packages:
  - apps/*
  - packages/*

# Versões compartilhadas entre os pacotes (use "catalog:" no package.json)
catalog:
  '@types/node': ^22.20.5
  typescript: ^5.9.3
  vitest: ^5.0.5
  zod: ^4.4.3

overrides:
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0

# Pacotes autorizados a rodar scripts de instalação (o pnpm bloqueia por padrão)
allowBuilds:
  sharp: true
  unrs-resolver: true
