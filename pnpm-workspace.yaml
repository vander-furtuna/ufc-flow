packages:
  - apps/*
  - packages/*

# Versões compartilhadas entre os pacotes (use "catalog:" no package.json)
catalog:
  '@types/node': ^22.20.5
  typescript: ^5.9.3
  '@vitest/coverage-v8': ^5.0.5
  vitest: ^5.0.5
  zod: ^4.6.7

overrides:
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  # Correções de segurança na cadeia de build do Plasmo (pnpm audit de
  # 01/11/2026). Nada disso entra no bundle da extensão.
  'plasmo>sharp': ^0.35.5
  'msgpackr@<1.10.1': ^1.12.1
  'browserslist@<4.28.7': ^4.29.5
  'content-security-policy-parser@<0.6.0': ^0.6.0
  'fflate@<0.8.3': ^0.8.3
  'tsup@<8.3.5': ^8.5.0
  'esbuild@<0.28.1': ^0.28.2
  'vue@<3.5.42': ^3.5.44
  'svelte@<5.55.7': ^5.57.3

# Pacotes autorizados a rodar scripts de instalação (o pnpm bloqueia por padrão)
allowBuilds:
  # Plasmo (Parcel) na extensão
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
  # Bloqueados de propósito: telemetria e módulos nativos opcionais (SSH do
  # cliente Docker do Testcontainers), dispensáveis
  '@scarf/scarf': false
  cpu-features: false
  protobufjs: false
  ssh2: false
