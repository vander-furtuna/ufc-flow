# PostgreSQL de desenvolvimento da API.
# Subir:  docker compose -f docker/compose.dev.yml up -d
# Parar:  docker compose -f docker/compose.dev.yml down   (-v apaga os dados)
name: ufc-flow-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ufcflow
      POSTGRES_PASSWORD: ufcflow
      POSTGRES_DB: ufcflow
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ufcflow -d ufcflow']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
