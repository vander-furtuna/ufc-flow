<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Entrar (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Clash Display';src:url('../assets/clash-display-variable.woff2') format('woff2');font-weight:200 700;font-display:swap}
body{margin:0;background:#ffffff}
a{color:#1d293d}a:hover{color:#020618}
input::placeholder{color:#62748e}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; padding: 48px 24px 32px; font-family: 'Geist', system-ui, sans-serif; color: #020618; background: #ffffff; display: flex; flex-direction: column; gap: 22px;">
  <svg aria-hidden="true" width="360" height="360" viewBox="0 0 100 100" style="position: absolute; right: -170px; top: -170px; opacity: 0.5; filter: blur(50px);"><defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#85FF4C"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs><circle cx="50" cy="50" r="50" fill="url(#mg)"/></svg>

  <img src="../assets/logo-ufc-flow.svg" alt="UFC Flow" style="position: relative; width: 148px; height: auto; display: block;">

  <div style="position: relative; display: flex; flex-direction: column; gap: 6px;">
    <h1 style="margin: 0; font-family: 'Clash Display', 'Geist', sans-serif; font-weight: 600; font-size: 28px; line-height: 34px;">{{heading}}</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #45556c;">{{subheading}}</p>
  </div>

  <div role="tablist" aria-label="Acesso" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 14px;">
    <button role="tab" aria-selected="{{isLogin}}" onClick="{{pickLogin}}" style="{{loginTab}}">Entrar</button>
    <button role="tab" aria-selected="{{isSignup}}" onClick="{{pickSignup}}" style="{{signupTab}}">Criar conta</button>
  </div>

  <sc-if value="{{isLogin}}" hint-placeholder-val="{{true}}">
    <form style="display: flex; flex-direction: column; gap: 14px; margin: 0;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="m-email" style="font-size: 14px; font-weight: 500; color: #1d293d;">E-mail</label>
        <input id="m-email" type="email" inputmode="email" autocomplete="email" placeholder="voce@alu.ufc.br" style="height: 48px; box-sizing: border-box; padding: 0 16px; border: 1px solid #e2e8f0; border-radius: 14px; font: inherit; font-size: 16px;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; align-items: baseline;"><label for="m-senha" style="font-size: 14px; font-weight: 500; color: #1d293d;">Senha</label><a href="#ajuda" style="font-size: 13px; color: #45556c;">Esqueci a senha</a></div>
        <input id="m-senha" type="password" autocomplete="current-password" value="••••••••••" style="height: 48px; box-sizing: border-box; padding: 0 16px; border: 1px solid #e2e8f0; border-radius: 14px; font: inherit; font-size: 16px;">
      </div>
      <button type="submit" style="height: 52px; margin-top: 4px; border: 0; border-radius: 14px; background: #0f172b; color: #f8fafc; font: inherit; font-size: 16px; font-weight: 600;">Entrar</button>
      <p id="ajuda" style="margin: 0; padding: 12px 14px; border-radius: 12px; background: #f1f5f9; font-size: 13px; line-height: 1.5; color: #45556c;">Para redefinir a senha, peça a um administrador um link de uso único.</p>
    </form>
  </sc-if>

  <sc-if value="{{isSignup}}" hint-placeholder-val="{{false}}">
    <form style="display: flex; flex-direction: column; gap: 12px; margin: 0;">
      <div style="display: flex; flex-direction: column; gap: 6px;"><label for="m-nome" style="font-size: 14px; font-weight: 500;">Nome</label><input id="m-nome" autocomplete="name" style="height: 48px; box-sizing: border-box; padding: 0 16px; border: 1px solid #e2e8f0; border-radius: 14px; font: inherit; font-size: 16px;"></div>
      <div style="display: flex; flex-direction: column; gap: 6px;"><label for="m-email2" style="font-size: 14px; font-weight: 500;">E-mail</label><input id="m-email2" type="email" placeholder="voce@alu.ufc.br" style="height: 48px; box-sizing: border-box; padding: 0 16px; border: 1px solid #e2e8f0; border-radius: 14px; font: inherit; font-size: 16px;"></div>
      <div style="display: flex; flex-direction: column; gap: 6px;"><label for="m-senha2" style="font-size: 14px; font-weight: 500;">Senha</label><input id="m-senha2" type="password" placeholder="Mínimo de 8 caracteres" style="height: 48px; box-sizing: border-box; padding: 0 16px; border: 1px solid #e2e8f0; border-radius: 14px; font: inherit; font-size: 16px;"></div>
      <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.5; color: #45556c;"><input type="checkbox" style="margin: 2px 0 0; width: 20px; height: 20px; accent-color: #0f172b;"><span>Aceito os <a href="#termos">Termos</a> e a <a href="#privacidade">Política de privacidade</a>.</span></label>
      <button type="submit" style="height: 52px; border: 0; border-radius: 14px; background: #0f172b; color: #f8fafc; font: inherit; font-size: 16px; font-weight: 600;">Criar conta</button>
    </form>
  </sc-if>

  <a href="#cursos" style="margin-top: auto; height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid #e2e8f0; border-radius: 14px; background: #f1f5f9; font-size: 15px; font-weight: 500; color: #1d293d; text-decoration: none;">Continuar sem conta<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'login' }; }
  renderVals() {
    const login = this.state.tab === 'login';
    const base = 'height: 40px; border: 0; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 600; ';
    const on = base + 'background: #ffffff; color: #020618; box-shadow: 0 1px 2px rgba(2,6,24,0.08);';
    const off = base + 'background: transparent; color: #45556c;';
    return {
      isLogin: login,
      isSignup: !login,
      heading: login ? 'Bem-vindo de volta' : 'Crie sua conta',
      subheading: login ? 'Seu histórico, agendas e o hub do curso em qualquer lugar.' : 'Depois você vincula seu curso e matrícula.',
      loginTab: login ? on : off,
      signupTab: login ? off : on,
      pickLogin: () => this.setState({ tab: 'login' }),
      pickSignup: () => this.setState({ tab: 'signup' })
    };
  }
}
</script>
</body>
</html>
