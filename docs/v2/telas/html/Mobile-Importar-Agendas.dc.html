<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Importar agendas locais (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Clash Display';src:url('../assets/clash-display-variable.woff2') format('woff2');font-weight:200 700;font-display:swap}
body{margin:0;background:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: 'Geist', system-ui, sans-serif; color: #020618; background: #f1f5f9;">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(2,6,24,0.45);"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="mi-title" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 20px 28px; border-radius: 24px 24px 0 0; background: #ffffff; display: flex; flex-direction: column; gap: 16px;">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #cbd5e1;"></span>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="width: 44px; height: 44px; border-radius: 14px; background: #ecfeff; color: #0e7490; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/><path d="M12 12v6M9 15l3-3 3 3"/></svg></span>
      <h2 id="mi-title" style="margin: 6px 0 0; font-family: 'Clash Display', 'Geist', sans-serif; font-weight: 600; font-size: 22px; line-height: 28px;">3 agendas neste aparelho</h2>
      <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #45556c;">Importe para a sua conta e veja em qualquer dispositivo.</p>
    </div>

    <label style="{{row1}}">
      <input type="checkbox" checked="{{c1}}" onChange="{{t1}}" style="width: 22px; height: 22px; margin: 0; accent-color: #0f172b;">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 3px;"><b style="font-size: 15px; font-weight: 600;">Meu cronograma</b><span style="font-size: 12px; color: #45556c;">2026.1 · 5 turmas</span><span style="font-size: 12px; color: #15803d; font-weight: 500;">✓ Eng. de Computação</span></span>
    </label>

    <div style="{{row2}}">
      <input id="mi2" type="checkbox" checked="{{c2}}" onChange="{{t2}}" style="width: 22px; height: 22px; margin: 0; accent-color: #0f172b;">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0;">
        <label for="mi2" style="display: flex; flex-direction: column; gap: 3px;"><b style="font-size: 15px; font-weight: 600;">Plano B</b><span style="font-size: 12px; color: #45556c;">2026.1 · 4 turmas · curso a confirmar</span></label>
        <label style="display: block;"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Curso da agenda Plano B</span><select style="width: 100%; height: 44px; padding: 0 10px; border: 1px solid #e2e8f0; border-radius: 12px; background: #ffffff; font: inherit; font-size: 14px;"><option>Eng. de Computação (4 de 4 turmas)</option><option>Eng. Elétrica (1 de 4)</option></select></label>
      </span>
    </div>

    <label style="{{row3}}">
      <input type="checkbox" checked="{{c3}}" onChange="{{t3}}" style="width: 22px; height: 22px; margin: 0; accent-color: #0f172b;">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 3px;"><b style="font-size: 15px; font-weight: 600;">Agenda 2025.2</b><span style="font-size: 12px; color: #45556c;">2025.2 · 6 turmas</span><span style="font-size: 12px; color: #b45309; font-weight: 500;">1 turma não existe mais e fica de fora</span></span>
    </label>

    <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 4px;">
      <button disabled="{{none}}" style="{{cta}}">{{ctaLabel}}</button>
      <button style="height: 48px; border: 0; border-radius: 14px; background: transparent; font: inherit; font-size: 15px; font-weight: 500; color: #45556c;">Agora não</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { a: true, b: true, c: false }; }
  renderVals() {
    const s = this.state;
    const n = [s.a, s.b, s.c].filter(Boolean).length;
    const row = (on) => 'display: flex; gap: 14px; align-items: flex-start; padding: 14px; border-radius: 16px; ' + (on ? 'border: 2px solid #0f172b; background: #f8fafc;' : 'border: 1px solid #e2e8f0; background: #ffffff;');
    return {
      c1: s.a, c2: s.b, c3: s.c,
      t1: () => this.setState({ a: !s.a }),
      t2: () => this.setState({ b: !s.b }),
      t3: () => this.setState({ c: !s.c }),
      row1: row(s.a), row2: row(s.b), row3: row(s.c),
      none: n === 0,
      ctaLabel: n === 0 ? 'Selecione uma agenda' : 'Importar ' + n + (n === 1 ? ' agenda' : ' agendas'),
      cta: 'height: 52px; border: 0; border-radius: 14px; font: inherit; font-size: 16px; font-weight: 600; ' + (n === 0 ? 'background: #e2e8f0; color: #62748e;' : 'background: #0f172b; color: #f8fafc;')
    };
  }
}
</script>
</body>
</html>
